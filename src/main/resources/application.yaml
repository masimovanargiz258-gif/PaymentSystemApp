server:
  port: 8088

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: nara20
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  messages:
    encoding: UTF-8

scheduler:
  payment:
    cron: "0/10 * * * * *"
  card:
    expire:
      cron: "0 0 0 * * *"
  account:
    expire:
      cron: "0 0 0 * * *"

payment:
  limits:
    card-min-balance: 10
    account-min-balance: 5
    monthly-limit: 100
    card-limit: 2
    account-limit: 3
    external-commission-rate: 0.02