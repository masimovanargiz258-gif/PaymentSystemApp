databaseChangeLog:
  - changeSet:
      id: 004-create-card-orders-table
      author: nargiz
      changes:
        - createTable:
            tableName: card_orders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: card_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: card_name
                  type: varchar(255)
              - column:
                  name: order_status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_card_orders_customer
                    references: customers(id)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp