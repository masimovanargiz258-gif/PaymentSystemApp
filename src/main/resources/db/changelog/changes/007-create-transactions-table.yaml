databaseChangeLog:
  - changeSet:
      id: 007-create-transactions-table
      author: nargiz
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: decimal(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: payment_source_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: from_account_number
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: to_account_number
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: payment_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_payment
                    references: payments(id)